<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telegram Bot 后台登入</title>
<link rel="stylesheet" href="/login.css"></head>
<body><div class="login"><section class="simple-login-card">
<div class="simple-login-icon" aria-hidden="true"><svg viewBox="0 0 40 40" fill="none"><path d="M7 18.1 32.2 8.4c.9-.4 1.7.4 1.4 1.4l-6 23.1c-.2.8-1.2 1.1-1.8.5l-8.2-6.8-4.5 3.8.8-8.2L7 19.9c-.9-.3-.9-1.5 0-1.8Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="m14 22.2 12-8-8.4 12.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<h1>Telegram Bot 后台登入</h1>
<form id="lf">
<label for="un">账号</label><input type="text" id="un" autocomplete="username" autocapitalize="off" placeholder="输入账号" autofocus required>
<label for="pw">密码</label><div class="password-wrap"><input type="password" id="pw" required autocomplete="current-password" placeholder="输入密码"><button type="button" id="showPassword" aria-label="显示密码" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
<div id="lerr" role="alert"></div><button class="btn" id="go" type="submit">登入</button>
</form><p class="simple-login-help">忘记密码？请联系管理员。</p>
</section></div>
<script src="/login.js"></script></body></html>
