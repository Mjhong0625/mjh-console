<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MJH 后台登入</title>
<style>:root{--bg:#0e0f11;--card:#17181b;--line:#2a2c31;--tx:#ececee;--mu:#8b8d94}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
form{max-width:340px;margin:22vh auto 0;padding:0 16px;display:grid;gap:10px}h1{font-size:18px;margin:0}
input,button{font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--tx);padding:11px 12px}
button{background:#fff;color:#000;border-color:#fff;cursor:pointer}button:disabled{opacity:.6}.mu{color:var(--mu);font-size:12px}#er{color:#f87171;min-height:18px}</style></head>
<body><form id="f"><h1>MJH 品牌后台</h1><div class="mu">输入你的登入账号，系统会带你进入所属品牌的后台</div>
<input id="u" placeholder="账号" autocapitalize="off" autocomplete="username" autofocus required><button id="b">继续</button><div id="er"></div></form>
<script>document.getElementById("f").onsubmit=async e=>{e.preventDefault();const b=document.getElementById("b"),er=document.getElementById("er");b.disabled=true;er.textContent="";
try{const r=await fetch("/go",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:document.getElementById("u").value})});const j=await r.json();if(r.ok)location.href=j.url;else{er.textContent=j.error;b.disabled=false}}catch(x){er.textContent="网络错误，请重试";b.disabled=false}}</script></body></html>
